name: Deploy Supabase Edge Functions

# Note : les migrations SQL ne sont PAS appliquées par ce workflow.
# L'historique local est désynchronisé du remote (le projet a été
# bootstrappé avant l'usage de la CLI). Appliquer les migrations à la
# main via le SQL Editor Supabase (Dashboard → SQL Editor).
on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy only changed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^supabase/functions/' | awk -F'/' '{print $3}' | sort -u)
          if [ -z "$CHANGED" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No function changes detected."
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            CHANGED=$(ls -1 supabase/functions/ 2>/dev/null | grep -v '^_' || true)
          fi
          for fn in $CHANGED; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "→ Deploying: $fn"
              supabase functions deploy "$fn" --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
            fi
          done
