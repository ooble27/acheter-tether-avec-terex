name: Deploy Supabase (functions + migrations)

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── Migrations SQL ──────────────────────────────────────────────────
      # On applique les migrations avant de déployer les functions : si une
      # migration ajoute une table utilisée par une function, la function
      # doit trouver la table en place au premier appel.
      - name: Apply pending migrations
        if: ${{ hashFiles('supabase/migrations/*.sql') != '' }}
        run: |
          MIG_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^supabase/migrations/' || true)
          # Sur workflow_dispatch (pas de diff), on tente toujours ; sinon on
          # ne push que s'il y a eu du changement dans migrations/.
          if [ -n "$MIG_CHANGED" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "→ Applying migrations to Supabase project"
            supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
            supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}" --yes
          else
            echo "No migration changes detected."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── Edge Functions ──────────────────────────────────────────────────
      - name: Deploy only changed functions
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^supabase/functions/' | awk -F'/' '{print $3}' | sort -u)
          if [ -z "$CHANGED" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No function changes detected."
            exit 0
          fi
          # Sur workflow_dispatch sans diff, on redéploie toutes les functions.
          if [ -z "$CHANGED" ]; then
            CHANGED=$(ls -1 supabase/functions/ 2>/dev/null | grep -v '^_')
          fi
          for fn in $CHANGED; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "→ Deploying: $fn"
              supabase functions deploy "$fn" --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
