name: Apply Supabase Migration (manual)

# Applique les migrations SQL contenues dans supabase/migrations/
# via l'API Management Supabase. Déclenchement manuel uniquement.

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Nom du fichier .sql (vide = plus récent)'
        required: false
        default: ''

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          INPUT_FILE: ${{ inputs.migration_file }}
        run: |
          python3 <<'PYEOF'
          import os, glob, sys, urllib.request, urllib.error, json

          project = os.environ.get("PROJECT_REF", "").strip()
          token   = os.environ.get("SUPABASE_ACCESS_TOKEN", "").strip()
          inp     = os.environ.get("INPUT_FILE", "").strip()

          if not project:
              sys.exit("❌ SUPABASE_PROJECT_ID secret manquant")
          if not token:
              sys.exit("❌ SUPABASE_ACCESS_TOKEN secret manquant")

          if inp:
              path = f"supabase/migrations/{inp}"
              if not os.path.isfile(path):
                  sys.exit(f"❌ Fichier introuvable : {path}")
          else:
              files = sorted(glob.glob("supabase/migrations/[0-9]*_*.sql"))
              # Format standard YYYYMMDDhhmmss_nom.sql
              import re
              files = [f for f in files if re.search(r"/\d{14}_.*\.sql$", f)]
              if not files:
                  sys.exit("❌ Aucune migration standard trouvée")
              path = files[-1]

          print(f"→ Applying {path}")
          with open(path) as fh:
              sql = fh.read()
          print("──── SQL ────")
          print(sql)
          print("─────────────")

          url = f"https://api.supabase.com/v1/projects/{project}/database/query"
          data = json.dumps({"query": sql}).encode()
          req = urllib.request.Request(
              url,
              data=data,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = resp.read().decode()
                  print(f"──── Response (HTTP {resp.status}) ────")
                  print(body)
                  print("─────────────────────────────────────")
                  print("✅ Migration appliquée")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"❌ HTTP {e.code}")
              print(body)
              sys.exit(1)
          PYEOF
