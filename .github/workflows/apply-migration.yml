name: Apply Supabase Migration (manual)

# Workflow one-shot pour appliquer les migrations SQL contenues dans
# supabase/migrations/. Utilise l'API Management de Supabase (endpoint
# /database/query) — pas la CLI supabase db push (qui échoue à cause du
# désalignement d'historique local vs remote).
#
# À déclencher manuellement depuis GitHub Actions → Run workflow.
# Accepte en input le nom d'un fichier précis, sinon applique le plus
# récent (par nom).

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Nom du fichier .sql (vide = plus récent)'
        required: false
        default: ''

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          INPUT_FILE: ${{ inputs.migration_file }}
        run: |
          if [ -n "$INPUT_FILE" ]; then
            F="supabase/migrations/$INPUT_FILE"
          else
            # Plus récent au format standard YYYYMMDDhhmmss_nom.sql
            F=$(ls supabase/migrations/[0-9]*_*.sql 2>/dev/null | grep -E '/[0-9]{14}_.*\.sql$' | sort | tail -1)
          fi
          if [ -z "$F" ] || [ ! -f "$F" ]; then
            echo "❌ Aucun fichier de migration trouvé"
            exit 1
          fi
          echo "→ Applying $F"
          echo "──── SQL ────"
          cat "$F"
          echo "─────────────"

          body=$(jq -Rs '{query: .}' < "$F")
          URL="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"
          http_code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body")

          echo "──── Response (HTTP $http_code) ────"
          cat /tmp/resp.json
          echo
          echo "─────────────────────────────────────"

          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "❌ Migration échouée"
            exit 1
          fi
          echo "✅ Migration appliquée"
